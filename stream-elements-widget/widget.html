<div id="spectrum-stardew-widget" class="spectrum-stardew-widget is-hidden">
  <div class="event-panel">
    <div class="event-heading">
      <span class="status-indicator"></span>
      <span id="event-kicker">SPECTRUM STARDew</span>
      <span id="event-state">CONNECTING</span>
    </div>
    <div class="event-body">
      <div id="summon-wheel" class="summon-wheel is-spinning" aria-hidden="true">
        <div class="wheel-segments"></div>
        <div class="wheel-core"><span id="wheel-symbol">?</span></div>
      </div>
      <div class="event-copy">
        <div id="event-title" class="event-title">CHAT SUMMONED</div>
        <div id="event-viewer" class="event-viewer"></div>
        <div id="event-monsters" class="event-monsters"></div>
        <div id="event-location" class="event-location"></div>
      </div>
    </div>
  </div>
</div>
<div id="spectrum-stardew-setup" class="setup-hint is-hidden">
  Set your Twitch broadcaster ID in this widget's Fields tab.
</div>
