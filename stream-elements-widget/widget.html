<div id="spectrum-stardew-widget" class="spectrum-stardew-widget is-hidden">
  <section id="death-counter" class="death-counter">
    <div class="counter-kicker"><span class="status-indicator"></span> CHALLENGE SERIES</div>
    <div id="challenge-name" class="challenge-name">Spectrum Challenge</div>
    <div class="death-total-row">
      <span id="death-count" class="death-count">0</span>
      <span class="death-label">DEATHS</span>
    </div>
    <div id="counter-connection" class="counter-connection">CONNECTING</div>
  </section>

  <section id="event-panel" class="event-panel is-hidden">
    <div class="event-heading">
      <span class="status-indicator"></span>
      <span>SPECTRUM STARDEW</span>
      <span id="event-state">INCOMING</span>
    </div>
    <div class="event-body">
      <div id="summon-wheel" class="summon-wheel is-spinning" aria-hidden="true">
        <div class="wheel-segments"></div>
        <div class="wheel-core"><span id="wheel-symbol">?</span></div>
      </div>
      <div class="event-copy">
        <div id="event-title" class="event-title">CHAT SUMMONED</div>
        <div id="event-viewer" class="event-viewer"></div>
        <div id="event-monsters" class="event-monsters"></div>
        <div id="event-location" class="event-location"></div>
      </div>
    </div>
  </section>
</div>
<div id="spectrum-stardew-setup" class="setup-hint is-hidden">
  Enter this streamer's numeric Twitch broadcaster ID in the widget Fields tab.
</div>
