<div id="spectrum-charity-meter" class="spectrum-charity-meter">
  <section class="charity-card">
    <header class="charity-header">
      <div class="charity-brand"><span class="charity-dot"></span><span id="charity-title">SPECTRUM CHARITY</span></div>
      <span id="charity-connection" class="charity-connection">CONNECTING</span>
    </header>
    <div class="charity-amount-row">
      <strong id="charity-amount">$0.00</strong>
      <span class="charity-goal">/ $100.00 AUD</span>
      <span id="charity-percent" class="charity-percent">0%</span>
    </div>
    <div class="charity-track" role="progressbar" aria-label="Shared Spectrum charity progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="charity-fill" class="charity-fill"></div>
      <div class="charity-ticks" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i class="mega"></i>
        <i></i><i></i><i></i><i></i><i class="mega"></i>
        <i></i><i></i><i></i><i></i><i class="mega"></i>
        <i></i><i></i><i></i><i></i><i class="mega"></i>
      </div>
    </div>
    <footer class="charity-footer">
      <span>HORDE · $5</span>
      <span class="mega-label">MEGA HORDE · $25</span>
      <span id="charity-alert" class="charity-alert" aria-live="polite"></span>
    </footer>
  </section>
</div>
